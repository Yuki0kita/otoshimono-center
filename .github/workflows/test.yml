name: test

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "site/data/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/
